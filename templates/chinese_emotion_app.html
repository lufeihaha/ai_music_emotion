<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中文音乐情感识别</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        .main-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            margin: 2rem auto;
            max-width: 800px;
            padding: 2rem;
        }
        
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .header h1 {
            color: #333;
            font-weight: 700;
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }
        
        .header p {
            color: #666;
            font-size: 1.1rem;
        }
        
        .upload-area {
            border: 3px dashed #007bff;
            border-radius: 15px;
            padding: 3rem;
            text-align: center;
            background: rgba(0, 123, 255, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 2rem;
        }
        
        .upload-area:hover {
            border-color: #0056b3;
            background: rgba(0, 123, 255, 0.1);
            transform: translateY(-2px);
        }
        
        .upload-area.dragover {
            border-color: #28a745;
            background: rgba(40, 167, 69, 0.1);
        }
        
        .upload-icon {
            font-size: 4rem;
            color: #007bff;
            margin-bottom: 1rem;
        }
        
        .upload-text {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 0.5rem;
        }
        
        .upload-hint {
            color: #666;
            font-size: 0.9rem;
        }
        
        .file-input {
            display: none;
        }
        
        .emotion-result {
            display: none;
            text-align: center;
            padding: 2rem;
            margin: 2rem 0;
            border-radius: 15px;
            animation: fadeIn 0.5s ease-in;
        }
        
        .emotion-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        .emotion-name {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .emotion-description {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            opacity: 0.8;
        }
        
        .confidence-bar {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            height: 20px;
            margin: 1rem 0;
            overflow: hidden;
        }
        
        .confidence-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.8s ease;
            background: linear-gradient(90deg, #28a745, #20c997);
        }
        
        .confidence-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }
        
        .emotion-details {
            display: none;
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
        }
        
        .probability-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }
        
        .probability-item:last-child {
            border-bottom: none;
        }
        
        .probability-bar {
            flex: 1;
            height: 8px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
            margin: 0 1rem;
            overflow: hidden;
        }
        
        .probability-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
        }
        
        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        .error-message {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 10px;
            margin: 1rem 0;
            border: 1px solid #f5c6cb;
        }
        
        .btn-custom {
            background: linear-gradient(45deg, #007bff, #0056b3);
            border: none;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 25px;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }
        
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
            color: white;
        }
        
        .info-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 1.5rem;
            margin-top: 2rem;
            border-left: 4px solid #007bff;
        }
        
        .supported-formats {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .format-tag {
            background: #e9ecef;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.9rem;
            color: #495057;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .emotion-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .emotion-card {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .emotion-card:hover {
            transform: translateY(-5px);
        }
        
        .emotion-card-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .emotion-card-name {
            font-weight: 600;
            margin-bottom: 0.3rem;
        }
        
        .emotion-card-desc {
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-container">
            <!-- 头部 -->
            <div class="header">
                <h1>🎵 中文音乐情感识别</h1>
                <p>上传您的音乐文件，AI将识别其中的情感色彩</p>
            </div>
            
            <!-- 上传区域 -->
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">
                    <i class="fas fa-cloud-upload-alt"></i>
                </div>
                <div class="upload-text">点击或拖拽音频文件到此处</div>
                <div class="upload-hint">支持 MP3、WAV、FLAC、M4A、AAC、OGG 格式，最大16MB</div>
                <input type="file" class="file-input" id="audioFile" accept="audio/*">
            </div>
            
            <!-- 加载状态 -->
            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
                <div>正在分析音频情感...</div>
            </div>
            
            <!-- 错误信息 -->
            <div class="error-message" id="errorMessage"></div>
            
            <!-- 情感结果 -->
            <div class="emotion-result" id="emotionResult">
                <div class="emotion-icon" id="emotionIcon">😊</div>
                <div class="emotion-name" id="emotionName">快乐</div>
                <div class="emotion-description" id="emotionDescription">欢快、愉悦、开心的情感</div>
                <div class="confidence-bar">
                    <div class="confidence-fill" id="confidenceFill"></div>
                </div>
                <div class="confidence-text" id="confidenceText">置信度: 85%</div>
                
                <!-- 详细概率分布 -->
                <div class="emotion-details" id="emotionDetails">
                    <h5>所有情感概率分布</h5>
                    <div id="probabilityList"></div>
                </div>
                
                <button class="btn btn-custom mt-3" onclick="toggleDetails()">
                    <i class="fas fa-chart-bar"></i> 查看详细分析
                </button>
                
                <button class="btn btn-outline-primary mt-3 ms-2" onclick="resetUpload()">
                    <i class="fas fa-redo"></i> 重新上传
                </button>
            </div>
            
            <!-- 支持的情感类型 -->
            <div class="info-card">
                <h5><i class="fas fa-info-circle"></i> 支持的情感类型</h5>
                <div class="emotion-grid">
                    <div class="emotion-card">
                        <div class="emotion-card-icon">😊</div>
                        <div class="emotion-card-name">快乐</div>
                        <div class="emotion-card-desc">欢快、愉悦、开心</div>
                    </div>
                    <div class="emotion-card">
                        <div class="emotion-card-icon">🍃</div>
                        <div class="emotion-card-name">平静</div>
                        <div class="emotion-card-desc">宁静、安详、放松</div>
                    </div>
                    <div class="emotion-card">
                        <div class="emotion-card-icon">⚡</div>
                        <div class="emotion-card-name">激昂</div>
                        <div class="emotion-card-desc">激动、热情、充满活力</div>
                    </div>
                    <div class="emotion-card">
                        <div class="emotion-card-icon">☁️</div>
                        <div class="emotion-card-name">忧郁</div>
                        <div class="emotion-card-desc">悲伤、忧愁、低沉</div>
                    </div>
                    <div class="emotion-card">
                        <div class="emotion-card-icon">⏰</div>
                        <div class="emotion-card-name">怀念</div>
                        <div class="emotion-card-desc">思念、回忆、眷恋</div>
                    </div>
                    <div class="emotion-card">
                        <div class="emotion-card-icon">💕</div>
                        <div class="emotion-card-name">浪漫</div>
                        <div class="emotion-card-desc">温柔、甜蜜、爱情</div>
                    </div>
                    <div class="emotion-card">
                        <div class="emotion-card-icon">🌙</div>
                        <div class="emotion-card-name">深沉</div>
                        <div class="emotion-card-desc">深刻、沉重、内敛</div>
                    </div>
                    <div class="emotion-card">
                        <div class="emotion-card-icon">🎭</div>
                        <div class="emotion-card-name">激烈</div>
                        <div class="emotion-card-desc">强烈、紧张、戏剧性</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 获取DOM元素
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('audioFile');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const emotionResult = document.getElementById('emotionResult');
        const emotionIcon = document.getElementById('emotionIcon');
        const emotionName = document.getElementById('emotionName');
        const emotionDescription = document.getElementById('emotionDescription');
        const confidenceFill = document.getElementById('confidenceFill');
        const confidenceText = document.getElementById('confidenceText');
        const emotionDetails = document.getElementById('emotionDetails');
        const probabilityList = document.getElementById('probabilityList');
        
        // 情感颜色配置
        const emotionColors = {
            '快乐': '#FFD700',
            '平静': '#90EE90',
            '激昂': '#FF6347',
            '忧郁': '#9370DB',
            '怀念': '#CD853F',
            '浪漫': '#FF69B4',
            '深沉': '#4B0082',
            '激烈': '#DC143C'
        };
        
        // 上传区域点击事件
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });
        
        // 拖拽事件
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        
        // 文件选择事件
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });
        
        // 处理文件上传
        function handleFile(file) {
            // 验证文件类型
            const allowedTypes = ['audio/mp3', 'audio/wav', 'audio/flac', 'audio/m4a', 'audio/aac', 'audio/ogg'];
            const fileExtension = file.name.split('.').pop().toLowerCase();
            const allowedExtensions = ['mp3', 'wav', 'flac', 'm4a', 'aac', 'ogg'];
            
            if (!allowedExtensions.includes(fileExtension)) {
                showError('不支持的文件格式。请选择 MP3、WAV、FLAC、M4A、AAC 或 OGG 格式的音频文件。');
                return;
            }
            
            // 验证文件大小 (16MB)
            if (file.size > 16 * 1024 * 1024) {
                showError('文件太大，最大支持16MB。');
                return;
            }
            
            // 显示加载状态
            showLoading();
            
            // 创建FormData
            const formData = new FormData();
            formData.append('audio_file', file);
            
            // 发送请求
            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                hideLoading();
                
                if (data.success) {
                    showResult(data);
                } else {
                    showError(data.error || '处理失败');
                }
            })
            .catch(error => {
                hideLoading();
                showError('网络错误: ' + error.message);
            });
        }
        
        // 显示加载状态
        function showLoading() {
            loading.style.display = 'block';
            errorMessage.style.display = 'none';
            emotionResult.style.display = 'none';
        }
        
        // 隐藏加载状态
        function hideLoading() {
            loading.style.display = 'none';
        }
        
        // 显示错误信息
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            emotionResult.style.display = 'none';
        }
        
        // 显示结果
        function showResult(data) {
            // 设置情感信息
            emotionIcon.textContent = data.icon || '😊';
            emotionName.textContent = data.emotion || '未知';
            emotionDescription.textContent = data.description || '';
            
            // 设置置信度
            const confidence = Math.round(data.confidence * 100);
            confidenceFill.style.width = confidence + '%';
            confidenceText.textContent = `置信度: ${confidence}%`;
            
            // 设置颜色
            const color = emotionColors[data.emotion] || '#007bff';
            emotionResult.style.background = `linear-gradient(135deg, ${color}20, ${color}10)`;
            emotionResult.style.color = color;
            emotionResult.style.borderLeft = `5px solid ${color}`;
            
            // 设置概率分布
            if (data.all_probabilities) {
                probabilityList.innerHTML = '';
                
                // 按概率排序
                const sortedProbs = Object.entries(data.all_probabilities)
                    .sort((a, b) => b[1] - a[1]);
                
                sortedProbs.forEach(([emotion, prob]) => {
                    const item = document.createElement('div');
                    item.className = 'probability-item';
                    
                    const percentage = Math.round(prob * 100);
                    const barColor = emotionColors[emotion] || '#007bff';
                    
                    item.innerHTML = `
                        <span>${emotion}</span>
                        <div class="probability-bar">
                            <div class="probability-fill" style="width: ${percentage}%; background: ${barColor};"></div>
                        </div>
                        <span>${percentage}%</span>
                    `;
                    
                    probabilityList.appendChild(item);
                });
            }
            
            // 显示结果
            errorMessage.style.display = 'none';
            emotionResult.style.display = 'block';
        }
        
        // 切换详细信息显示
        function toggleDetails() {
            const isVisible = emotionDetails.style.display === 'block';
            emotionDetails.style.display = isVisible ? 'none' : 'block';
            
            const button = event.target;
            button.innerHTML = isVisible ? 
                '<i class="fas fa-chart-bar"></i> 查看详细分析' : 
                '<i class="fas fa-eye-slash"></i> 隐藏详细分析';
        }
        
        // 重置上传
        function resetUpload() {
            fileInput.value = '';
            emotionResult.style.display = 'none';
            errorMessage.style.display = 'none';
            emotionDetails.style.display = 'none';
        }
        
        // 页面加载时检查模型状态
        window.addEventListener('load', () => {
            fetch('/model_info')
                .then(response => response.json())
                .then(data => {
                    if (!data.success) {
                        showError('模型未加载，请先训练中文情感模型');
                        uploadArea.style.opacity = '0.5';
                        uploadArea.style.pointerEvents = 'none';
                    }
                })
                .catch(error => {
                    console.warn('无法获取模型信息:', error);
                });
        });
    </script>
</body>
</html>
