<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎭 多模态音乐情感识别系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .input-panel, .result-panel {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .input-panel h2, .result-panel h2 {
            color: #5a67d8;
            margin-bottom: 20px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .analysis-modes {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-weight: bold;
        }

        .mode-btn.active {
            background: #5a67d8;
            color: white;
            border-color: #5a67d8;
        }

        .mode-btn:hover {
            border-color: #5a67d8;
            transform: translateY(-2px);
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #4a5568;
        }

        .file-upload-area {
            border: 3px dashed #cbd5e0;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f7fafc;
        }

        .file-upload-area:hover {
            border-color: #5a67d8;
            background: #edf2f7;
        }

        .file-upload-area.dragover {
            border-color: #5a67d8;
            background: #e6fffa;
        }

        .lyrics-textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        .lyrics-textarea:focus {
            outline: none;
            border-color: #5a67d8;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #5a67d8, #667eea);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
        }

        .btn-warning {
            background: linear-gradient(135deg, #ed8936, #dd6b20);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result-content {
            min-height: 200px;
        }

        .result-display {
            background: #f7fafc;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .emotion-result {
            text-align: center;
            margin-bottom: 20px;
        }

        .emotion-icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .emotion-name {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .confidence-score {
            font-size: 1.2rem;
            color: #666;
        }

        .probability-bars {
            margin-top: 20px;
        }

        .probability-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .probability-label {
            width: 80px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .probability-bar {
            flex: 1;
            height: 20px;
            background: #e2e8f0;
            border-radius: 10px;
            margin: 0 10px;
            overflow: hidden;
        }

        .probability-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .probability-value {
            width: 50px;
            text-align: right;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .analysis-details {
            background: #edf2f7;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }

        .analysis-details h4 {
            color: #4a5568;
            margin-bottom: 10px;
        }

        .analysis-details p {
            color: #666;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #5a67d8;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #e53e3e;
        }

        .success-message {
            background: #c6f6d5;
            color: #22543d;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #38a169;
        }

        .comparison-section {
            grid-column: 1 / -1;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-top: 20px;
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .comparison-card {
            background: #f7fafc;
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #e2e8f0;
        }

        .comparison-card h4 {
            color: #5a67d8;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .input-panel, .result-panel {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎭 多模态音乐情感识别系统</h1>
            <p>结合音频特征与歌词语义，提供更准确的音乐情感分析</p>
        </header>

        <div class="main-content">
            <!-- 输入面板 -->
            <div class="input-panel">
                <h2>🎯 分析设置</h2>
                
                <!-- 分析模式选择 -->
                <div class="analysis-modes">
                    <div class="mode-btn active" data-mode="multimodal">
                        🎭 多模态分析
                    </div>
                    <div class="mode-btn" data-mode="audio">
                        🎵 仅音频
                    </div>
                    <div class="mode-btn" data-mode="lyrics">
                        📝 仅歌词
                    </div>
                </div>

                <!-- 音频上传 -->
                <div class="input-section" id="audio-section">
                    <label>🎵 音频文件</label>
                    <div class="file-upload-area" id="fileUploadArea">
                        <div>
                            <p style="font-size: 1.2rem; margin-bottom: 10px;">📁 点击或拖拽上传音频文件</p>
                            <p style="color: #666; font-size: 0.9rem;">支持 MP3, WAV, FLAC, M4A 格式</p>
                            <input type="file" id="audioFile" accept=".mp3,.wav,.flac,.m4a" style="display: none;">
                        </div>
                    </div>
                    <div id="fileName" style="margin-top: 10px; color: #5a67d8; font-weight: bold;"></div>
                </div>

                <!-- 歌词输入 -->
                <div class="input-section" id="lyrics-section">
                    <label>📝 歌词内容</label>
                    <textarea 
                        id="lyricsInput" 
                        class="lyrics-textarea" 
                        placeholder="请输入歌词内容...&#10;&#10;例如：&#10;阳光明媚的日子里&#10;我们一起快乐地唱歌跳舞&#10;幸福的感觉真美好">
                    </textarea>
                </div>

                <!-- 操作按钮 -->
                <div class="action-buttons">
                    <button class="btn btn-primary" id="analyzeBtn">
                        🔍 开始分析
                    </button>
                    <button class="btn btn-secondary" id="compareBtn" style="display: none;">
                        📊 对比分析
                    </button>
                    <button class="btn btn-warning" id="clearBtn">
                        🧹 清空重置
                    </button>
                </div>
            </div>

            <!-- 结果面板 -->
            <div class="result-panel">
                <h2>📊 分析结果</h2>
                <div class="result-content" id="resultContent">
                    <div style="text-align: center; padding: 40px; color: #666;">
                        <p style="font-size: 1.1rem;">🎯 选择分析模式并上传音频或输入歌词开始分析</p>
                    </div>
                </div>
                
                <!-- 图表显示区域 -->
                <div class="chart-section" id="chartSection" style="display: none;">
                    <h3>📈 可视化图表</h3>
                    <div class="chart-container" style="text-align: center; margin: 20px 0;">
                        <img id="chartImage" style="max-width: 100%; height: auto; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);" alt="情感分析图表">
                    </div>
                    <div class="chart-buttons" style="text-align: center; margin-top: 15px;">
                        <button class="btn btn-secondary" onclick="showVisualization()">
                            📊 显示图表
                        </button>
                        <button class="btn btn-primary" onclick="downloadVisualization()">
                            💾 下载图表
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 对比分析区域 -->
        <div class="comparison-section hidden" id="comparisonSection">
            <h2>🔄 多方法对比分析</h2>
            <div class="comparison-grid" id="comparisonGrid">
                <!-- 对比结果将在这里动态生成 -->
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn btn-primary" id="downloadComparisonBtn">
                    📥 下载对比图表
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'multimodal';
        let analysisResults = {};
        let audioFile = null;
        let latestResult = null;  // 保存最新的分析结果

        // DOM 元素
        const modeBtns = document.querySelectorAll('.mode-btn');
        const audioSection = document.getElementById('audio-section');
        const lyricsSection = document.getElementById('lyrics-section');
        const fileUploadArea = document.getElementById('fileUploadArea');
        const audioFileInput = document.getElementById('audioFile');
        const lyricsInput = document.getElementById('lyricsInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const compareBtn = document.getElementById('compareBtn');
        const clearBtn = document.getElementById('clearBtn');
        const resultContent = document.getElementById('resultContent');
        const comparisonSection = document.getElementById('comparisonSection');
        const comparisonGrid = document.getElementById('comparisonGrid');
        const fileName = document.getElementById('fileName');

        // 模式切换
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                updateUIForMode();
            });
        });

        function updateUIForMode() {
            switch(currentMode) {
                case 'multimodal':
                    audioSection.style.display = 'block';
                    lyricsSection.style.display = 'block';
                    break;
                case 'audio':
                    audioSection.style.display = 'block';
                    lyricsSection.style.display = 'none';
                    break;
                case 'lyrics':
                    audioSection.style.display = 'none';
                    lyricsSection.style.display = 'block';
                    break;
            }
        }

        // 文件上传处理
        fileUploadArea.addEventListener('click', () => audioFileInput.click());
        fileUploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileUploadArea.classList.add('dragover');
        });
        fileUploadArea.addEventListener('dragleave', () => {
            fileUploadArea.classList.remove('dragover');
        });
        fileUploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            fileUploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        audioFileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            const allowedTypes = ['audio/mp3', 'audio/wav', 'audio/flac', 'audio/m4a', 'audio/mpeg'];
            if (!allowedTypes.some(type => file.type.includes(type.split('/')[1]))) {
                showError('请选择有效的音频文件 (MP3, WAV, FLAC, M4A)');
                return;
            }
            
            audioFile = file;
            fileName.textContent = `✅ 已选择: ${file.name}`;
        }

        // 分析按钮
        analyzeBtn.addEventListener('click', async () => {
            if (!validateInput()) return;
            
            const endpoint = getEndpointForMode();
            const formData = new FormData();
            
            if (audioFile && (currentMode === 'multimodal' || currentMode === 'audio')) {
                formData.append('audio', audioFile);
            }
            
            if (currentMode === 'multimodal' || currentMode === 'lyrics') {
                formData.append('lyrics', lyricsInput.value.trim());
            }
            
            await performAnalysis(endpoint, formData);
        });

        function validateInput() {
            if (currentMode === 'audio' || currentMode === 'multimodal') {
                if (!audioFile) {
                    showError('请上传音频文件');
                    return false;
                }
            }
            
            if (currentMode === 'lyrics' || currentMode === 'multimodal') {
                if (!lyricsInput.value.trim()) {
                    showError('请输入歌词内容');
                    return false;
                }
            }
            
            return true;
        }

        function getEndpointForMode() {
            switch(currentMode) {
                case 'audio': return '/audio_only';
                case 'lyrics': return '/lyrics_only';
                case 'multimodal': return '/predict';
                default: return '/predict';
            }
        }

        async function performAnalysis(endpoint, formData) {
            showLoading();
            analyzeBtn.disabled = true;
            
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    analysisResults[currentMode] = result;
                    displayResult(result);
                    
                    // 如果有多个结果，显示对比按钮
                    if (Object.keys(analysisResults).length > 1) {
                        compareBtn.style.display = 'block';
                    }
                    
                    showSuccess('分析完成！');
                } else {
                    showError(result.error || '分析失败');
                }
            } catch (error) {
                showError('网络错误：' + error.message);
            } finally {
                analyzeBtn.disabled = false;
            }
        }

        function displayResult(result) {
            // 保存最新的结果
            latestResult = result;
            analysisResults[currentMode] = result;
            
            const emotionColors = {
                '快乐': '#FFD700',
                '平静': '#90EE90', 
                '激昂': '#FF6347',
                '忧郁': '#9370DB',
                '浪漫': '#FF69B4',
                '深沉': '#4B0082',
                '怀念': '#CD853F',
                '激烈': '#DC143C'
            };

            const emotionIcons = {
                '快乐': '😊',
                '平静': '🍃',
                '激昂': '⚡',
                '忧郁': '☁️',
                '浪漫': '💕',
                '深沉': '🌙',
                '怀念': '⏰',
                '激烈': '🎭'
            };

            resultContent.innerHTML = `
                <div class="result-display">
                    <div class="emotion-result">
                        <div class="emotion-icon">${emotionIcons[result.predicted_emotion] || '🎵'}</div>
                        <div class="emotion-name" style="color: ${emotionColors[result.predicted_emotion] || '#666'}">${result.predicted_emotion}</div>
                        <div class="confidence-score">置信度: ${(result.confidence * 100).toFixed(1)}%</div>
                    </div>
                    
                    <div class="probability-bars">
                        ${Object.entries(result.all_probabilities || {}).map(([emotion, prob]) => `
                            <div class="probability-item">
                                <span class="probability-label">${emotion}</span>
                                <div class="probability-bar">
                                    <div class="probability-fill" style="width: ${prob * 100}%; background-color: ${emotionColors[emotion] || '#ccc'}"></div>
                                </div>
                                <span class="probability-value">${(prob * 100).toFixed(1)}%</span>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="analysis-details">
                        <h4>📋 分析详情</h4>
                        <p><strong>分析方法:</strong> ${getModeName(result.modality)}</p>
                        <p><strong>详细说明:</strong> ${result.explanation || '无额外说明'}</p>
                        ${result.lyrics_result && result.lyrics_result.emotion_words_found && result.lyrics_result.emotion_words_found.length > 0 ? 
                            `<p><strong>关键情感词:</strong> ${result.lyrics_result.emotion_words_found.map(w => w.word).join(', ')}</p>` : ''
                        }
                    </div>
                    
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="btn btn-secondary" onclick="showVisualization()">
                            📊 显示图表
                        </button>
                        <button class="btn btn-primary" onclick="downloadVisualization()">
                            💾 下载图表
                        </button>
                        <button class="btn btn-warning" onclick="showFeedbackForm()">
                            💬 提供反馈
                        </button>
                    </div>
                </div>
            `;
            
            // 显示图表区域
            document.getElementById('chartSection').style.display = 'block';
        }

        function getModeName(modality) {
            const names = {
                'audio_only': '仅音频分析',
                'lyrics_only': '仅歌词分析',
                'multimodal': '多模态融合分析'
            };
            return names[modality] || modality;
        }

        // 对比分析
        compareBtn.addEventListener('click', async () => {
            if (Object.keys(analysisResults).length < 2) {
                showError('需要至少两种分析结果才能进行对比');
                return;
            }
            
            showComparison();
        });

        function showComparison() {
            comparisonSection.classList.remove('hidden');
            
            comparisonGrid.innerHTML = Object.entries(analysisResults).map(([mode, result]) => `
                <div class="comparison-card">
                    <h4>${getModeName(result.modality)} ${result.modality === mode ? '✅' : ''}</h4>
                    <p><strong>预测情感:</strong> ${result.predicted_emotion}</p>
                    <p><strong>置信度:</strong> ${(result.confidence * 100).toFixed(1)}%</p>
                    <div style="margin-top: 10px;">
                        <small style="color: #666;">
                            ${result.explanation ? result.explanation.substring(0, 100) + '...' : ''}
                        </small>
                    </div>
                </div>
            `).join('');
            
            comparisonSection.scrollIntoView({ behavior: 'smooth' });
        }

        // 图表显示和下载功能
        async function showVisualization() {
            if (!latestResult) {
                showError('没有可用的分析结果');
                return;
            }
            
            try {
                const response = await fetch('/visualize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        ...latestResult,
                        download: false  // 请求显示，不下载
                    })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success && result.image) {
                        // 显示图表
                        const chartImage = document.getElementById('chartImage');
                        chartImage.src = 'data:image/png;base64,' + result.image;
                        chartImage.style.display = 'block';
                        
                        // 滚动到图表区域
                        document.getElementById('chartSection').scrollIntoView({ behavior: 'smooth' });
                    } else {
                        showError('图表生成失败');
                    }
                } else {
                    showError('显示图表失败');
                }
            } catch (error) {
                showError('显示图表错误：' + error.message);
            }
        }

        async function downloadVisualization() {
            if (!latestResult) {
                showError('没有可用的分析结果');
                return;
            }
            
            try {
                const response = await fetch('/visualize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        ...latestResult,
                        download: true  // 请求下载
                    })
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'emotion_analysis.png';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                } else {
                    showError('下载失败');
                }
            } catch (error) {
                showError('下载错误：' + error.message);
            }
        }

        document.getElementById('downloadComparisonBtn').addEventListener('click', async () => {
            if (Object.keys(analysisResults).length < 2) return;
            
            try {
                const response = await fetch('/compare', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        results: Object.values(analysisResults)
                    })
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'emotion_comparison.png';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                } else {
                    showError('下载对比图表失败');
                }
            } catch (error) {
                showError('下载错误：' + error.message);
            }
        });

        // 清空重置
        clearBtn.addEventListener('click', () => {
            audioFile = null;
            audioFileInput.value = '';
            lyricsInput.value = '';
            fileName.textContent = '';
            resultContent.innerHTML = `
                <div style="text-align: center; padding: 40px; color: #666;">
                    <p style="font-size: 1.1rem;">🎯 选择分析模式并上传音频或输入歌词开始分析</p>
                </div>
            `;
            analysisResults = {};
            latestResult = null;
            compareBtn.style.display = 'none';
            comparisonSection.classList.add('hidden');
            // 隐藏图表区域
            document.getElementById('chartSection').style.display = 'none';
            document.getElementById('chartImage').style.display = 'none';
            hideMessages();
        });

        // 反馈功能
        function showFeedbackForm() {
            if (!latestResult) {
                showError('没有可用的分析结果');
                return;
            }
            
            const actualEmotion = prompt(`系统预测情感为："${latestResult.predicted_emotion}"\n\n请输入您认为的正确情感：\n（快乐、平静、激昂、忧郁、浪漫、深沉、怀念、激烈）`);
            
            if (actualEmotion) {
                const rating = prompt('请为预测结果评分（1-5分，5分最好）：');
                const comment = prompt('您还有其他建议吗？（可选）：') || '';
                
                if (rating && rating >= 1 && rating <= 5) {
                    submitFeedback(latestResult, actualEmotion, parseInt(rating), comment);
                }
            }
        }

        async function submitFeedback(result, actualEmotion, rating, comment) {
            try {
                const response = await fetch('/feedback', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        predicted_emotion: result.predicted_emotion,
                        actual_emotion: actualEmotion,
                        confidence: result.confidence,
                        modality: result.modality,
                        user_rating: rating,
                        user_comment: comment
                    })
                });
                
                if (response.ok) {
                    showSuccess('感谢您的反馈！这将帮助我们改进系统。');
                } else {
                    showError('反馈提交失败');
                }
            } catch (error) {
                showError('反馈提交错误：' + error.message);
            }
        }

        // 辅助函数
        function showLoading() {
            resultContent.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在分析中，请稍候...</p>
                </div>
            `;
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            document.querySelector('.container').insertBefore(errorDiv, document.querySelector('.main-content'));
            
            setTimeout(() => {
                errorDiv.remove();
            }, 5000);
        }

        function showSuccess(message) {
            const successDiv = document.createElement('div');
            successDiv.className = 'success-message';
            successDiv.textContent = message;
            document.querySelector('.container').insertBefore(successDiv, document.querySelector('.main-content'));
            
            setTimeout(() => {
                successDiv.remove();
            }, 3000);
        }

        function hideMessages() {
            document.querySelectorAll('.error-message, .success-message').forEach(el => el.remove());
        }

        // 初始化
        updateUIForMode();
    </script>
</body>
</html>
